# PostgreSQL 17 container configuration for the Bank Health capstone.
#
# Common commands:
#   docker compose up -d          Start the database in the background.
#   docker compose down           Stop the container (data persists in the pgdata volume).
#   docker compose down -v        Stop the container and wipe the database data.
#   docker compose exec db psql -U capstone -d bank_health   Open an interactive psql shell.
#
# Connection string for Python, psql, and Power BI:
#   host=localhost port=5432 dbname=bank_health user=capstone password=capstone

services:
  db:
    # Use the official Postgres 17 image.
    image: postgres:17

    # Assign a fixed container name so scripts can reference it
    # (e.g., `docker exec -i bank_health_db ...`) without guessing the generated name.
    container_name: bank_health_db

    # Credentials required by the Postgres image to initialize the database.
    # Must match the connection settings in src_retired_bc_no_pandas/postgres_connection.py.
    environment:
      POSTGRES_USER: capstone
      POSTGRES_PASSWORD: capstone
      POSTGRES_DB: bank_health

    # Expose the database to the host machine so Python scripts and Power BI can connect.
    ports:
      - "5432:5432"

    volumes:
      # Named volume to persist database data across container restarts.
      # Prevents the database from resetting every time `docker compose up` is run.
      - pgdata:/var/lib/postgresql/data

      # Mount the raw data folder as read-only.
      # Allows server-side COPY commands to read files directly from /data.
      - ./capstone_data:/data:ro

      # Mount the SQL scripts folder as read-only.
      # Allows `psql -f /sql/...` to run the build scripts from inside the container.
      - ./sql:/sql:ro

    # Tell Docker how to verify database is actually ready to accept connections as without this Docker only knows
    # container process started, not that Postgres is ready.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U capstone -d bank_health"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  # Define the named volume used above.
  pgdata: